# Real MySQL for the fake-db parity suite. Mirrors the app's own docker-compose.yml (same image
# tag, same schema mount, same credentials) so the real side behaves like production: MySQL 8
# defaults — InnoDB, STRICT_TRANS_TABLES, utf8mb4_0900_ai_ci. Don't "improve" the config here; a real
# side that differs from production makes the parity suite lie.
#
# Host port 3307 (not 3306) so it never collides with a local MySQL or the app's own compose stack.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webhooks
      MYSQL_USER: webhooks
      MYSQL_PASSWORD: webhooks
    ports:
      - "${PARITY_MYSQL_PORT:-3307}:3306"
    volumes:
      - ../../../../../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/mysql # throwaway: every run starts from init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "webhooks", "-pwebhooks"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Real Apache Kafka (KRaft, single node) for the fake-kafka parity suite. Production runs Apache Kafka
  # (MSK / self-hosted), so the real side is Apache Kafka — not a Kafka-compatible broker.
  # ASSUMPTION: 3.9.1 is a stand-in for production's broker version — set it to production's major.minor.
  #
  # The broker listens on the SAME port it advertises (PARITY_KAFKA_PORT, default 9392): the client is
  # on the host and follows the advertised address from metadata, so the host and container ports must match.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${PARITY_KAFKA_PORT:-9392},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${PARITY_KAFKA_PORT:-9392}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node: the internal topics can't replicate.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A consumer joins immediately instead of waiting out the default 3 s rebalance delay.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${PARITY_KAFKA_PORT:-9392}:${PARITY_KAFKA_PORT:-9392}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${PARITY_KAFKA_PORT:-9392} > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40
